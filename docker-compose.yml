services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-hackdb}
    ports:
      - "5432:5432"
    volumes:
      - dbdata:/var/lib/postgresql/data

  api:
    build: ./api
    depends_on: [ db ]
    env_file: .env
    ports:
      - "8000:8000"
    volumes:
      - ./api/app:/app/app:rw
      - ./api/migrations:/app/migrations:rw
      - ./api/alembic.ini:/app/alembic.ini:ro

  web:
    build: ./web
    ports:
      - "5173:5173"
    volumes:
      - ./web:/app
      - /app/node_modules

volumes:
  dbdata:


