version: "3.9"

services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-hackdb}
    ports:
      - "5432:5432"
    volumes:
      - dbdata:/var/lib/postgresql/data

  api:
    build: ./api
    depends_on: [db]
    env_file: .env
    ports:
      - "8000:8000"
    volumes:
      - ./api/app:/app/app:rw

  web:
    build: ./web
    ports:
      - "5173:5173"
    volumes:
      - ./web:/app

volumes:
  dbdata:

